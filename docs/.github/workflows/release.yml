name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: read
  pull-requests: write

# Versioning only. This workflow opens the changeset version pull request and
# nothing else — it does not build and it does not deploy.
#
# Deployment is intentionally separate from versioning. Cloudflare deployments
# need account credentials and production secrets, so they run from an explicit
# deployment workflow or a local `bun run deploy:vinext` invocation.
jobs:
  release:
    name: Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `package.json` requires node >=22; the runner defaults to 20, which is
      # missing `Set.prototype.union` that the lint toolchain relies on.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: bun 1.4.0 re-sends the Authorization header when it
          # follows GitHub Packages' redirect to its blob host, which
          # rejects a pre-signed URL that also carries one, so every
          # install of `@frontal-labs/ui` 403s.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install
        # `.npmrc` points the `@frontal-labs` scope at GitHub Packages and reads
        # its token from `GITHUB_TOKEN`. Without it every install 401s. It has to
        # be a GitHub credential: the org's `NPM_TOKEN` is an npmjs.com token,
        # which this registry rejects. The run's own token carries the job's
        # `packages: read` permission, and `@frontal-labs/ui` grants this
        # repository access.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v2
        # v2 renamed these inputs (`version` and `publish`) and stopped reading
        # a token from the environment, so the v1 spelling would leave the
        # action running its defaults with no credentials.
        # No `publish-script`. The action runs one when given it, and this
        # package is `"private": true`, so there is nothing to publish — the
        # step called `bun run release`, a script that does not exist, and
        # failed the workflow on every push to main. Without the input the
        # action only opens the version pull request, which is all a private
        # package can use it for.
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: bunx changeset version
