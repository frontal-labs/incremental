name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  quality:
    name: Code Quality
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `package.json` requires node >=22; the runner defaults to 20, which is
      # missing `Set.prototype.union` that the lint toolchain relies on.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: bun 1.4.0 re-sends the Authorization header when it
          # follows GitHub Packages' redirect to its blob host, which
          # rejects a pre-signed URL that also carries one, so every
          # install of `@frontal-labs/ui` 403s.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install
        # `.npmrc` points the `@frontal-labs` scope at GitHub Packages and reads
        # its token from `GITHUB_TOKEN`. Without it every install 401s. It has to
        # be a GitHub credential: the org's `NPM_TOKEN` is an npmjs.com token,
        # which this registry rejects. The run's own token carries the job's
        # `packages: read` permission, and `@frontal-labs/ui` grants this
        # repository access.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint & Format
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run Snyk security scan
        continue-on-error: true
        uses: snyk/actions/node@v1 # 1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  test:
    name: Unit and Integration Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `package.json` requires node >=22; the runner defaults to 20, which is
      # missing `Set.prototype.union` that the lint toolchain relies on.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: bun 1.4.0 re-sends the Authorization header when it
          # follows GitHub Packages' redirect to its blob host, which
          # rejects a pre-signed URL that also carries one, so every
          # install of `@frontal-labs/ui` 403s.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install
        # `.npmrc` points the `@frontal-labs` scope at GitHub Packages and reads
        # its token from `GITHUB_TOKEN`. Without it every install 401s. It has to
        # be a GitHub credential: the org's `NPM_TOKEN` is an npmjs.com token,
        # which this registry rejects. The run's own token carries the job's
        # `packages: read` permission, and `@frontal-labs/ui` grants this
        # repository access.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Tests
        run: bun run test

  e2e:
    name: E2E Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `package.json` requires node >=22; the runner defaults to 20, which is
      # missing `Set.prototype.union` that the lint toolchain relies on.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: bun 1.4.0 re-sends the Authorization header when it
          # follows GitHub Packages' redirect to its blob host, which
          # rejects a pre-signed URL that also carries one, so every
          # install of `@frontal-labs/ui` 403s.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install
        # `.npmrc` points the `@frontal-labs` scope at GitHub Packages and reads
        # its token from `GITHUB_TOKEN`. Without it every install 401s. It has to
        # be a GitHub credential: the org's `NPM_TOKEN` is an npmjs.com token,
        # which this registry rejects. The run's own token carries the job's
        # `packages: read` permission, and `@frontal-labs/ui` grants this
        # repository access.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright Browsers
        run: bun x playwright install --with-deps

      # Against a production build. `vinext dev` compiles each route on first
      # request, which outran the assertion timeouts, and it resolves a
      # `notFound()` to the global English document rather than the locale-aware
      # one.
      - name: Run E2E Tests
        run: bun run verify:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30

  # A compile check for the Cloudflare/vinext deployable artifact.
  build:
    name: Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `package.json` requires node >=22; the runner defaults to 20, which is
      # missing `Set.prototype.union` that the lint toolchain relies on.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: bun 1.4.0 re-sends the Authorization header when it
          # follows GitHub Packages' redirect to its blob host, which
          # rejects a pre-signed URL that also carries one, so every
          # install of `@frontal-labs/ui` 403s.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install
        # `.npmrc` points the `@frontal-labs` scope at GitHub Packages and reads
        # its token from `GITHUB_TOKEN`. Without it every install 401s. It has to
        # be a GitHub credential: the org's `NPM_TOKEN` is an npmjs.com token,
        # which this registry rejects. The run's own token carries the job's
        # `packages: read` permission, and `@frontal-labs/ui` grants this
        # repository access.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache vinext
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.vinext
            ${{ github.workspace }}/dist
          key: ${{ runner.os }}-vinext-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-vinext-${{ hashFiles('**/bun.lock') }}-

      - name: Build
        run: bun run build:vinext
        env:
          NEXT_TELEMETRY_DISABLED: 1
