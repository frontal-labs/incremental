[project]
name = "incremental"
version = "0.1.0"
description = "Incremental dependency engine — Python tooling configuration"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
# Ruff configuration for the Incremental engine Python code
target-version = "py310"
line-length = 100
indent-width = 4
exclude = [
  ".git",
  ".toolchain",
  "node_modules",
  "dist",
  "build",
  "logs",
  "*.egg-info",
  "__pycache__",
  ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "D", "RET", "SIM", "TID", "TRY", "W"]
ignore = [
  "E501",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D205",
  "D401",
  "PLR2004",
  "TRY300",
]

[tool.ruff.lint.isort]
known-first-party = ["incremental"]
known-third-party = ["pytest", "requests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test helpers raise AssertionError with the observed output in the message, on purpose.
"bindings/python/tests/**" = ["TRY003"]

[tool.ruff.format]
# Re-export style: preserve trailing comma, magic trailing comma
line-ending = "lf"
skip-magic-trailing-comma = false
preview = false

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["incremental"]
known_third_party = ["pytest", "requests"]
force_sort_within_sections = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
