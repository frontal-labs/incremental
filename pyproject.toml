[project]
name = "incremental"
version = "0.1.0"
description = "Incremental dependency engine — Python tooling configuration"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
# Ruff configuration for the Incremental engine Python code
target-version = "py310"
line-length = 100
indent-width = 4
exclude = [
    ".git",
    ".toolchain",
    "node_modules",
    "dist",
    "build",
    "logs",
    "*.egg-info",
    "__pycache__",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "P",    # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TRY",  # tryceratops
    "W",    # pycodestyle warnings
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "D100",  # missing docstring in public module
    "D101",  # missing docstring in public class
    "D102",  # missing docstring in public method
    "D103",  # missing docstring in public function
    "D104",  # missing docstring in public package
    "D205",  # 1 blank line required between summary line and description
    "D401",  # first line of docstring should be in imperative mood
    "PLR2004",  # magic value used in comparison
    "TRY300",  # raise without from inside except
]

[tool.ruff.lint.isort]
known-first-party = ["incremental"]
known-third-party = ["pytest", "requests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Re-export style: preserve trailing comma, magic trailing comma
line-ending = "lf"
skip-magic-trailing-comma = false
preview = false

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["incremental"]
known_third_party = ["pytest", "requests"]
force_sort_within_sections = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
