name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "Features"
    labels: ["enhancement", "feature"]
  - title: "Bug Fixes"
    labels: ["bug", "fix"]
  - title: "Documentation"
    labels: ["docs"]
  - title: "Maintenance"
    labels: ["chore", "ci"]
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
template: |
  ## Changes

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
autolabeler:
  - label: "bug"
    files: ["**/*.ts", "**/*.js"]
    title: "/fix/i"
  - label: "enhancement"
    title: "/feat/i"
version-resolver:
  major:
    labels: ["breaking"]
  minor:
    labels: ["enhancement", "feature"]
  patch:
    labels: ["bug", "fix", "chore"]
  default: patch
