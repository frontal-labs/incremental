name: Stale

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "This issue has been automatically marked as stale. It will be closed in 14 days if no further activity occurs."
          stale-pr-message: "This PR has been automatically marked as stale. It will be closed in 14 days if no further activity occurs."
          days-before-stale: 60
          days-before-close: 14
