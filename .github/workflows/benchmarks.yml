name: Bench

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run full benchmarksmark suite'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  benchmarks-smoke:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '2.2'
      - name: Run benchmarks smoke
        run: make benchmarks-smoke

  benchmarks:
    name: Full benchmarksmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '2.2'
      - name: Run benchmarks
        run: make benchmarks

  benchmarksmark-kill-test:
    name: Benchmark kill test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '2.2'