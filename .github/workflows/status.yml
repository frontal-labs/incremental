name: Status

on:
  push:
    branches: [main]
    paths:
      - "status/**"
      - "evidence/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    name: Status report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "2.2"
      - name: Generate status
        run: make status
      - name: Verify status files
        run: |
          for f in status/*.json; do
            echo "Checking $f..."
            ID=$(cat "$f" | jq -r '.id')
            STATE=$(cat "$f" | jq -r '.state')
            echo "  $ID: $STATE"
            if [ "$STATE" != "done" ] && [ "$STATE" != "in_progress" ] && [ "$STATE" != "blocked" ]; then
              echo "  WARN: unknown state '$STATE' for $ID"
            fi
          done
          echo "PASS status check"
