name: Status

on:
  push:
    branches: [main]
    paths:
      - "status/**"
      - "evidence/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    name: Status report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Generate status
        run: make status
      - name: Verify status files
        run: |
          for f in status/*.json; do
            echo "Checking $f..."
            ID=$(cat "$f" | jq -r '.id')
            STATE=$(cat "$f" | jq -r '.state')
            echo "  $ID: $STATE"
            if [ "$STATE" != "done" ] && [ "$STATE" != "in_progress" ] && [ "$STATE" != "blocked" ]; then
              echo "  WARN: unknown state '$STATE' for $ID"
            fi
          done
          echo "PASS status check"
