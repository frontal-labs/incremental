name: Docker

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'docker/Dockerfile.linux'
      - 'core/**'
      - 'bindings/**'
      - 'cli/**'
      - 'mcp/**'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'docker/Dockerfile.linux'
      - 'core/**'
      - 'bindings/**'
      - 'cli/**'
      - 'mcp/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.linux
          push: false
          tags: backplane:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test Docker image
        run: |
          docker run --rm backplane:latest node -e "console.log('docker smoke test passed')"