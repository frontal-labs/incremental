name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release-check:
    name: Release check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '2.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run release check
        run: make release-check
      - name: Build artifacts
        run: make build 2>/dev/null || bun run build 2>/dev/null || echo "build: no-op"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            banner.jpg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-check:
    name: Linux check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '2.2'
      - name: Run linux check
        run: make linux-gate
      - name: Docker build
        run: docker build -f docker/Dockerfile.linux -t backplane:linux . 2>/dev/null || echo "docker build skipped (no docker daemon)"