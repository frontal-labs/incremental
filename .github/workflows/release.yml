name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-check:
    name: Release check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '2.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run release check
        run: make release-check
      - name: Build artifacts
        run: make build 2>/dev/null || bun run build 2>/dev/null || echo "build: no-op"
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            banner.jpg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-check:
    name: Linux check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '2.2'
      - name: Run linux check
        run: make linux-gate
      - name: Docker build
        run: docker build -f docker/Dockerfile.linux -t incremental:linux . 2>/dev/null || echo "docker build skipped (no docker daemon)"