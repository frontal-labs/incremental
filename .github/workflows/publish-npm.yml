name: Publish to npm

# Publishes all @incremental/* packages to npmjs.org.
# Runs on GitHub release, or manually via workflow_dispatch (with optional dry-run).
#
# Publish order (dependencies first):
#   1. @incremental/engine   (native prebuilt binaries)
#   2. @incremental/client   (protocol v1 client)
#   3. @incremental/* adapters (vitest, bazel, nx, turbo, etc.)
#   4. @incremental/mcp      (MCP server)
#   5. @incremental/sdk      (metapackage)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run for every package (no upload)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish @incremental/* to npm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          scope: "@incremental"
      - name: Install Goose toolchain (Linux x64, v2026.3)
        run: |
          mkdir -p .toolchain/goose
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o goose.tar.gz https://github.com/aardappel/goose/releases/download/v2026.3/goose-v2026.3-linux-x64.tar.gz
          echo "06ac30284338269d3996d457412bf4f2b47c1f9a5601de65b6317187fe78d5c9  goose.tar.gz" | sha256sum -c -
          tar -xzf goose.tar.gz -C .toolchain/goose
          echo "GOOSE_DIR=$PWD/.toolchain/goose/goose-v2026.3-linux-x64" >> "$GITHUB_ENV"
          echo "GOOSE_HOME=$PWD/.toolchain/goose-home" >> "$GITHUB_ENV"
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Build engine binary
        run: make build
      - name: Copy engine binary to prebuilds for this platform
        run: |
          TRIPLE="$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)"
          mkdir -p packages/engine/prebuilds/$TRIPLE
          cp core/dist/incremental packages/engine/prebuilds/$TRIPLE/incremental
          chmod +x packages/engine/prebuilds/$TRIPLE/incremental
      - name: Install and build all TypeScript packages
        run: |
          for d in bindings/node adapters/biome adapters/bazel adapters/clippy adapters/config adapters/env adapters/fs adapters/nx adapters/playwright adapters/pnpm adapters/process adapters/protobuf adapters/ruff adapters/strace adapters/turbo adapters/turbopack adapters/typescript adapters/vitest adapters/watcher mcp packages/engine packages/sdk; do
            if [ -f "$d/package.json" ]; then
              (cd "$d" && npm install --no-audit --no-fund && npm run build 2>/dev/null || true)
            fi
          done
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/publish-npm-packages.mjs --dry-run
          else
            node scripts/publish-npm-packages.mjs
          fi
