name: Publish to npm

# Publishes all @incremental/* packages to npmjs.org.
# Runs on GitHub release, or manually via workflow_dispatch (with optional dry-run).
#
# Publish order (dependencies first):
#   1. @incremental/engine   (native prebuilt binaries)
#   2. @incremental/client   (protocol v1 client)
#   3. @incremental/* adapters (vitest, bazel, nx, turbo, etc.)
#   4. @incremental/mcp      (MCP server)
#   5. @incremental/sdk      (metapackage)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run for every package (no upload)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Builds the native engine binary on a runner matching each npm triple.
  # Goose compiles its generated C with the host compiler, so a darwin-x64
  # binary can only be built on a darwin-x64 host (Rosetta); cross-targeting
  # is not supported. linux-arm64 is listed in the engine's os/cpu fields and
  # served by install.js downloads (see packages/engine/install.js) rather
  # than a bundled prebuild.
  engine-prebuilds:
    name: Build engine prebuild (${{ matrix.triple }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: darwin-arm64
            runs-on: macos-latest
          - triple: darwin-x64
            runs-on: macos-13
          - triple: linux-x64
            runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build and stage engine prebuild
        working-directory: packages/engine
        run: node scripts/build-prebuilds.mjs --target ${{ matrix.triple }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-prebuild-${{ matrix.triple }}
          path: packages/engine/prebuilds/${{ matrix.triple }}/incremental
          if-no-files-found: error

  publish:
    name: Publish @incremental/* to npm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: engine-prebuilds
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          scope: "@incremental"
      - name: Download engine prebuilds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: engine-prebuild-*
          path: prebuild-artifacts
          merge-multiple: true
      - name: Stage prebuilds for the npm tarball
        run: |
          mkdir -p packages/engine/prebuilds
          for f in prebuild-artifacts/incremental; do
            [ -f "$f" ] || continue
            # prebuild-artifacts/<triple>/incremental -> <triple>
            TRIPLE="$(basename "$(dirname "$f")")"
            mkdir -p "packages/engine/prebuilds/$TRIPLE"
            cp "$f" "packages/engine/prebuilds/$TRIPLE/incremental"
            chmod +x "packages/engine/prebuilds/$TRIPLE/incremental"
          done
          ls -l packages/engine/prebuilds/*/incremental
      - name: Install Goose toolchain (Linux x64, v2026.3)
        run: |
          mkdir -p .toolchain/goose
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o goose.tar.gz https://github.com/aardappel/goose/releases/download/v2026.3/goose-v2026.3-linux-x64.tar.gz
          echo "06ac30284338269d3996d457412bf4f2b47c1f9a5601de65b6317187fe78d5c9  goose.tar.gz" | sha256sum -c -
          tar -xzf goose.tar.gz -C .toolchain/goose
          echo "GOOSE_DIR=$PWD/.toolchain/goose/goose-v2026.3-linux-x64" >> "$GITHUB_ENV"
          echo "GOOSE_HOME=$PWD/.toolchain/goose-home" >> "$GITHUB_ENV"
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Build git adapter binary (native only)
        run: |
          mkdir -p core/dist adapters/git/dist
          "$GOOSE_DIR/goose" build adapters/git/src/changes.goose -o adapters/git/dist/incremental-git
      - name: Install and build all TypeScript packages
        run: |
          for d in bindings/node adapters/biome adapters/bazel adapters/clippy adapters/config adapters/env adapters/fs adapters/nx adapters/playwright adapters/pnpm adapters/process adapters/protobuf adapters/ruff adapters/strace adapters/turbo adapters/turbopack adapters/typescript adapters/vitest adapters/watcher mcp packages/engine packages/sdk; do
            if [ -f "$d/package.json" ]; then
              (cd "$d" && npm install --no-audit --no-fund && npm run build 2>/dev/null || true)
            fi
          done
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/publish-npm-packages.mjs --dry-run
          else
            node scripts/publish-npm-packages.mjs
          fi
