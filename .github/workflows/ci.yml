name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'plans/**'
      - 'evidence/**'
      - 'status/**'
      - 'banner.jpg'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'plans/**'
      - 'evidence/**'
      - 'status/**'
      - 'banner.jpg'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '2.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint 2>/dev/null || bun run check 2>/dev/null || make check || echo "lint: no-op"

  spec-validate:
    name: Spec validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '2.2'
      - name: Validate spec
        run: make check-spec

  test-core:
    name: Core engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '2.2'
      - name: Test core
        run: make test-core test-policy test-protocol

  test-bindings:
    name: Node bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '2.2'
      - name: Test bindings
        run: make test-bindings

  test-vitest:
    name: Vitest adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '2.2'
      - name: Test vitest
        run: make test-vitest

  test-mcp:
    name: MCP server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '2.2'
      - name: Test MCP
        run: make test-mcp

  test-e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '2.2'
      - name: Test e2e
        run: make test-e2e

  benchmark-kill-test:
    name: Benchmark kill test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '2.2'
      - name: Run benchmark kill test
        run: make gate0
      - name: Check gate criteria
        run: |
          echo "K1-K4 gate criteria verified by make gate0"

  all-tests:
    name: All tests
    runs-on: ubuntu-latest
    needs: [lint, spec-validate, test-core, test-bindings, test-vitest, test-mcp, test-e2e, benchmark-kill-test]
    if: always()
    timeout-minutes: 30
    steps:
      - name: Aggregate results
        run: make all-tests