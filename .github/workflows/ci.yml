name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-tests:
    name: All tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Goose toolchain (Linux x64, v2026.3)
        run: |
          mkdir -p .toolchain/goose
          curl -fsSL -o goose.tar.gz https://github.com/aardappel/goose/releases/download/v2026.3/goose-v2026.3-linux-x64.tar.gz
          echo "06ac30284338269d3996d457412bf4f2b47c1f9a5601de65b6317187fe78d5c9  goose.tar.gz" | sha256sum -c -
          tar -xzf goose.tar.gz -C .toolchain/goose
          echo "GOOSE_DIR=$PWD/.toolchain/goose/goose-v2026.3-linux-x64" >> "$GITHUB_ENV"
      - name: Install adapter tools (ruff, protoc, buf, pnpm, bazelisk)
        run: |
          pip install ruff==0.14.13
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          npm install -g pnpm@9.0.0 @bufbuild/buf@1.70.0 @bazel/bazelisk@1.28.1
      - name: Install TypeScript package dependencies
        run: |
          # Root install provides node_modules/.bin/tsc-rs, which the build target uses for benchmarks/replay.
          pnpm install --frozen-lockfile --ignore-scripts
          for d in bindings/node adapters/vitest adapters/typescript adapters/config adapters/env adapters/fs adapters/process adapters/biome adapters/clippy adapters/bazel adapters/nx adapters/playwright adapters/pnpm adapters/protobuf adapters/ruff adapters/turbo adapters/turbopack adapters/watcher apps/mcp; do
            (cd "$d" && npm install --no-audit --no-fund)
          done
      - name: All tests
        run: make all-tests test-python test-git test-fuzz
      - name: Upload strace logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: strace-logs
          path: logs/strace/
          if-no-files-found: ignore
