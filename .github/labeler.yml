# Labeler configuration
# https://github.com/actions/labeler

"area: core":
  - changed-files:
      - any-glob-to-any-file: ["core/**"]
"area: bindings":
  - changed-files:
      - any-glob-to-any-file: ["bindings/**"]
"area: cli":
  - changed-files:
      - any-glob-to-any-file: ["cli/**"]
"area: mcp":
  - changed-files:
      - any-glob-to-any-file: ["mcp/**"]
"area: adapters":
  - changed-files:
      - any-glob-to-any-file: ["adapters/**"]
"area: docs":
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "**.md"]
"area: ci":
  - changed-files:
      - any-glob-to-any-file: [".github/**", "Makefile"]
