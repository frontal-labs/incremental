[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "incremental-client"
version = "0.1.0"
description = "Python client for the Incremental dependency engine (protocol v1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]

# Engine prebuild staged by scripts/build_wheel.py (one platform per wheel).
[tool.setuptools.package-data]
incremental_client = ["prebuilds/*/incremental"]
